name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: repsy
          server-username: REPSY_USERNAME
          server-password: REPSY_PASSWORD
      - name: Publicar no Repsy
        env:
          REPSY_USERNAME: ${{ secrets.REPSY_USERNAME }}
          REPSY_PASSWORD: ${{ secrets.REPSY_PASSWORD }}
        run: mvn -B clean deploy
      - name: Gerar fat-jar da CLI
        run: mvn -B -Pcli -DskipTests package
      - name: Criar GitHub Release com a CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp target/xml-danfse-br-cli.jar "xml-danfse-br-cli-${VERSION}.jar"
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Biblioteca: br.com.origam:xml-danfse-br:${VERSION}. O jar anexo e a CLI standalone (java -jar). Veja o CHANGELOG.md." \
            "xml-danfse-br-cli-${VERSION}.jar"
